<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Poppy Obby 3D</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:'Arial Black',Arial,sans-serif; touch-action:none; user-select:none; }
#canvas { display:block; width:100vw; height:100vh; }
#hud {
  position:fixed; top:0; left:0; right:0;
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 14px;
  background:linear-gradient(180deg,rgba(0,0,0,0.8) 0%,transparent 100%);
  pointer-events:none; z-index:10;
}
#hud-title { font-size:16px; font-weight:900; color:#ff3c8e; text-shadow:0 0 15px #ff3c8e; }
#hud-center { display:flex; flex-direction:column; align-items:center; gap:2px; }
#hud-level { font-size:12px; color:#fff; font-weight:900; text-shadow:0 0 8px #6c63ff; }
#hud-score { font-size:11px; color:#ffd700; text-shadow:0 0 8px #ffd700; }
#hud-lives { font-size:20px; }
#progress-bar {
  position:fixed; top:52px; left:14px; right:14px; height:6px;
  background:rgba(255,255,255,0.1); border-radius:3px; z-index:10; overflow:hidden; pointer-events:none;
}
#progress-fill {
  height:100%; width:0%;
  background:linear-gradient(90deg,#ff3c8e,#6c63ff,#00e5ff);
  border-radius:3px; box-shadow:0 0 8px #6c63ff;
}
#controls {
  position:fixed; bottom:0; left:0; right:0;
  display:flex; justify-content:space-between; align-items:flex-end;
  padding:16px; pointer-events:none; z-index:10;
}
#joystick-zone {
  width:130px; height:130px; border-radius:50%;
  background:rgba(255,255,255,0.06);
  border:2px solid rgba(255,60,142,0.35);
  position:relative; pointer-events:all;
  display:flex; align-items:center; justify-content:center;
}
#joystick-knob {
  width:52px; height:52px; border-radius:50%;
  background:radial-gradient(circle,#ff3c8e,#900040);
  border:2px solid rgba(255,255,255,0.6);
  position:absolute; pointer-events:none;
  box-shadow:0 0 16px #ff3c8e88;
}
#right-btns { display:flex; flex-direction:column; gap:10px; pointer-events:all; }
.abtn {
  width:68px; height:68px; border-radius:50%; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:900;
  -webkit-tap-highlight-color:transparent; transition:transform 0.08s;
}
.abtn:active { transform:scale(0.85); }
#jump-btn { background:radial-gradient(circle,#6c63ff,#2a0080); color:#fff; box-shadow:0 0 18px #6c63ff99; }
#cam-btn  { background:rgba(0,229,255,0.12); color:#00e5ff; border:2px solid #00e5ff44; }
.screen {
  position:fixed; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  z-index:100; background:rgba(0,0,0,0.88); backdrop-filter:blur(10px);
}
.screen h1 { font-size:clamp(24px,7vw,46px); font-weight:900; text-align:center; line-height:1.1; margin-bottom:10px; }
.screen p { color:#bbb; font-size:15px; text-align:center; margin-bottom:22px; max-width:300px; line-height:1.5; white-space:pre-line; }
.big-btn {
  padding:13px 40px; border:none; border-radius:50px;
  font-size:17px; font-weight:900; cursor:pointer;
  letter-spacing:2px; text-transform:uppercase;
  -webkit-tap-highlight-color:transparent; margin:5px; transition:transform 0.08s;
}
.big-btn:active { transform:scale(0.92); }
.btn-pink   { background:linear-gradient(135deg,#ff3c8e,#aa0044); color:#fff; box-shadow:0 0 25px #ff3c8e55,0 5px 0 #600020; }
.btn-purple { background:linear-gradient(135deg,#6c63ff,#2a0080); color:#fff; box-shadow:0 0 25px #6c63ff55,0 5px 0 #100040; }
.btn-gold   { background:linear-gradient(135deg,#ffd700,#ff8800); color:#000; box-shadow:0 0 25px #ffd70055,0 5px 0 #884400; }
#start-screen h1 { color:#ff3c8e; text-shadow:0 0 25px #ff3c8e; }
#huggy-icon { font-size:72px; margin-bottom:14px; animation:bounce 1.4s ease-in-out infinite; filter:drop-shadow(0 0 18px #ff3c8e); }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
#level-clear-screen h1 { color:#ffd700; text-shadow:0 0 30px #ffd700; }
#gameover-screen h1 { color:#ff3c8e; text-shadow:0 0 35px #ff3c8e; }
#win-screen h1 { color:#6c63ff; text-shadow:0 0 35px #6c63ff; }
.badge { font-size:56px; margin-bottom:12px; animation:spin 2s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }
#level-dots { display:flex; gap:8px; margin-bottom:18px; }
.ldot { width:13px; height:13px; border-radius:50%; background:#333; border:2px solid #555; transition:all 0.3s; }
.ldot.done   { background:#ffd700; border-color:#ffd700; box-shadow:0 0 8px #ffd700; }
.ldot.active { background:#ff3c8e; border-color:#ff3c8e; box-shadow:0 0 8px #ff3c8e; transform:scale(1.35); }
#flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:50; transition:opacity 0.1s; }
#msg {
  position:fixed; top:44%; left:50%; transform:translate(-50%,-50%);
  font-size:26px; font-weight:900; color:#fff; text-shadow:0 0 25px #6c63ff;
  z-index:20; pointer-events:none; opacity:0; transition:opacity 0.25s; text-align:center;
}
#cp-banner {
  position:fixed; top:72px; left:50%; transform:translateX(-50%);
  background:linear-gradient(135deg,#6c63ff,#ff3c8e);
  color:#fff; font-size:14px; font-weight:900;
  padding:8px 24px; border-radius:30px;
  z-index:20; pointer-events:none; opacity:0; transition:opacity 0.3s; letter-spacing:2px;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="flash"></div>
<div id="hud">
  <div id="hud-title">🧸 POPPY</div>
  <div id="hud-center">
    <div id="hud-level">LEVEL 1</div>
    <div id="hud-score">⭐ 0</div>
  </div>
  <div id="hud-lives">❤️❤️❤️</div>
</div>
<div id="progress-bar"><div id="progress-fill"></div></div>
<div id="msg"></div>
<div id="cp-banner">✅ CHECKPOINT!</div>
<div id="controls">
  <div id="joystick-zone"><div id="joystick-knob"></div></div>
  <div id="right-btns">
    <button class="abtn" id="cam-btn">CAM</button>
    <button class="abtn" id="jump-btn">JUMP</button>
  </div>
</div>

<!-- START -->
<div class="screen" id="start-screen">
  <div id="huggy-icon">🧸</div>
  <h1>POPPY PLAYTIME<br>OBBY 3D</h1>
  <p>Mainkan Huggy Wuggy!<br>5 Level makin susah!</p>
  <div id="level-dots">
    <div class="ldot active" id="dot0"></div>
    <div class="ldot" id="dot1"></div>
    <div class="ldot" id="dot2"></div>
    <div class="ldot" id="dot3"></div>
    <div class="ldot" id="dot4"></div>
  </div>
  <button class="big-btn btn-pink" onclick="startGame()">▶ MAIN!</button>
</div>

<!-- LEVEL CLEAR -->
<div class="screen" id="level-clear-screen" style="display:none">
  <div class="badge">🏆</div>
  <h1>LEVEL CLEAR!</h1>
  <p id="lc-msg">Lanjut!</p>
  <button class="big-btn btn-gold" onclick="nextLevel()">➡ LANJUT!</button>
  <button class="big-btn btn-purple" onclick="restartGame()">🔄 DARI AWAL</button>
</div>

<!-- GAME OVER -->
<div class="screen" id="gameover-screen" style="display:none">
  <div style="font-size:64px;margin-bottom:12px">💀</div>
  <h1>GAME OVER</h1>
  <p>Huggy Wuggy jatuh!</p>
  <button class="big-btn btn-pink" onclick="restartFromCheckpoint()">↩ COBA LAGI</button>
  <button class="big-btn btn-purple" onclick="restartGame()">🔄 DARI AWAL</button>
</div>

<!-- WIN -->
<div class="screen" id="win-screen" style="display:none">
  <div class="badge">🎉</div>
  <h1>KAMU MENANG!</h1>
  <p id="win-score">Semua level selesai!</p>
  <button class="big-btn btn-gold" onclick="restartGame()">🔄 MAIN LAGI</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ════════ RENDERER ════════
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(68, window.innerWidth/window.innerHeight, 0.1, 300);

const ambient = new THREE.AmbientLight(0x334466, 0.8); scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(15,25,10); sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-80; sun.shadow.camera.right=80;
sun.shadow.camera.top=80; sun.shadow.camera.bottom=-80; sun.shadow.camera.far=300;
scene.add(sun);
const pl1 = new THREE.PointLight(0xff3c8e,2.5,35); scene.add(pl1);
const pl2 = new THREE.PointLight(0x6c63ff,2.5,35); scene.add(pl2);

// ════════ PHYSICS (early) ════════
const pos = new THREE.Vector3(0,4,0);
const vel = new THREE.Vector3();
let onGround=false, jumpCount=0;
const GRAVITY=-24, JUMP_FORCE=10, MOVE_SPEED=7, MAX_FALL=-60;

// ════════ GAME STATE ════════
let lives=3, score=0, currentLevel=0, gameRunning=false;
let isDead=false, deathTimer=0, levelComplete=false;
let checkpointPos = new THREE.Vector3();
let platforms=[], movingPlats=[], spinners=[], collectibles=[], checkpoints=[], levelObjects=[];
let cameraMode=0, time=0, lastTime=0, msgTimeout, cpTimeout;

const LEVELS=[
  {name:'BABY STEPS',   fogC:0x050515, fogD:0.012, ps:1.0, ss:1.0, gf:1.0, ma:3},
  {name:'GETTING HOT',  fogC:0x100500, fogD:0.014, ps:1.4, ss:1.5, gf:1.2, ma:4},
  {name:'DANGER ZONE',  fogC:0x0a0010, fogD:0.016, ps:1.9, ss:2.2, gf:1.4, ma:5},
  {name:'NIGHTMARE',    fogC:0x0d0000, fogD:0.018, ps:2.5, ss:3.0, gf:1.6, ma:6},
  {name:"HUGGY'S WRATH",fogC:0x000d05, fogD:0.020, ps:3.2, ss:4.0, gf:1.8, ma:7},
];

// ════════ MATERIALS ════════
function mat(color,emissive=0x000000,ei=0.3){
  return new THREE.MeshLambertMaterial({color,emissive,emissiveIntensity:ei});
}
const BLUE  = mat(0x1a8fe8,0x003388,0.25);
const DBLUE = mat(0x0d5faa,0x002255,0.2);
const WHITE = mat(0xffffff,0x222222,0.1);
const BLACK = mat(0x111111,0x000000,0.0);
const TEETH = mat(0xeeeeee,0x888888,0.05);

// ════════ CAPSULE HELPER ════════
function capsuleGrp(r,h,material){
  const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,12),material));
  const t=new THREE.Mesh(new THREE.SphereGeometry(r,12,8),material); t.position.y=h/2; g.add(t);
  const b=new THREE.Mesh(new THREE.SphereGeometry(r,12,8),material); b.position.y=-h/2; g.add(b);
  return g;
}

// ════════ HUGGY WUGGY ════════
const playerGroup = new THREE.Group();
scene.add(playerGroup);

// Body
const bodyG = capsuleGrp(0.38,0.72,BLUE);
bodyG.position.y=0.78;
bodyG.children.forEach(c=>c.castShadow=true);
playerGroup.add(bodyG);

// HEAD — boxy rectangular (not round!)
const headGrp = new THREE.Group();
headGrp.position.y=1.72;
playerGroup.add(headGrp);

// Main head — wide flat box
const headMain = new THREE.Mesh(new THREE.BoxGeometry(0.94,0.70,0.76),BLUE);
headMain.castShadow=true; headGrp.add(headMain);
// Cheek sides
const chkL = new THREE.Mesh(new THREE.BoxGeometry(0.12,0.56,0.66),BLUE);
chkL.position.x=-0.53; headGrp.add(chkL);
const chkR = new THREE.Mesh(new THREE.BoxGeometry(0.12,0.56,0.66),BLUE);
chkR.position.x=0.53; headGrp.add(chkR);
// Cranium bump
const cranium = new THREE.Mesh(new THREE.BoxGeometry(0.78,0.20,0.64),BLUE);
cranium.position.y=0.44; headGrp.add(cranium);
// Ear bumps
const earL = new THREE.Mesh(new THREE.BoxGeometry(0.08,0.20,0.20),DBLUE);
earL.position.set(-0.54,0.22,0); headGrp.add(earL);
const earR = new THREE.Mesh(new THREE.BoxGeometry(0.08,0.20,0.20),DBLUE);
earR.position.set(0.54,0.22,0); headGrp.add(earR);

// Large oval eyes
const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.155,12,10),WHITE);
eyeL.scale.set(1,1.25,0.55); eyeL.position.set(-0.24,0.08,0.39); headGrp.add(eyeL);
const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.155,12,10),WHITE);
eyeR.scale.set(1,1.25,0.55); eyeR.position.set(0.24,0.08,0.39); headGrp.add(eyeR);
// Pupils
const pupL = new THREE.Mesh(new THREE.SphereGeometry(0.075,8,8),BLACK);
pupL.scale.set(1,1.1,0.6); pupL.position.set(-0.24,0.08,0.43); headGrp.add(pupL);
const pupR = new THREE.Mesh(new THREE.SphereGeometry(0.075,8,8),BLACK);
pupR.scale.set(1,1.1,0.6); pupR.position.set(0.24,0.08,0.43); headGrp.add(pupR);
// Shine
const shM = mat(0xffffff,0xffffff,1);
const shL2 = new THREE.Mesh(new THREE.SphereGeometry(0.03,6,6),shM); shL2.position.set(-0.21,0.14,0.46); headGrp.add(shL2);
const shR2 = new THREE.Mesh(new THREE.SphereGeometry(0.03,6,6),shM); shR2.position.set(0.27,0.14,0.46); headGrp.add(shR2);

// HUGE mouth cavity
const mCav = new THREE.Mesh(new THREE.BoxGeometry(0.74,0.20,0.12),BLACK);
mCav.position.set(0,-0.22,0.38); headGrp.add(mCav);
// Upper teeth
for(let i=-2;i<=2;i++){
  const t=new THREE.Mesh(new THREE.BoxGeometry(0.10,0.14,0.10),TEETH);
  t.position.set(i*0.13,-0.14,0.38); headGrp.add(t);
}
// Lower teeth
for(let i=-1;i<=1;i++){
  const t=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.10,0.09),TEETH);
  t.position.set(i*0.16+0.06,-0.30,0.38); headGrp.add(t);
}
// Nose
const nose = new THREE.Mesh(new THREE.BoxGeometry(0.12,0.08,0.08),DBLUE);
nose.position.set(0,-0.02,0.42); headGrp.add(nose);

// Long arms
function makeArm(side){
  const g=new THREE.Group();
  const up=capsuleGrp(0.11,0.6,BLUE); up.children.forEach(c=>c.castShadow=true); g.add(up);
  const fa=capsuleGrp(0.095,0.5,BLUE); fa.position.y=-0.6; fa.children.forEach(c=>c.castShadow=true); g.add(fa);
  const hand=new THREE.Mesh(new THREE.SphereGeometry(0.14,10,8),DBLUE); hand.position.y=-1.0; hand.castShadow=true; g.add(hand);
  for(let f=-1;f<=1;f++){
    const fi=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.12,0.04),DBLUE);
    fi.position.set(f*0.06,-1.17,0.05); g.add(fi);
  }
  g.position.set(side*0.62,1.1,0); g.rotation.z=side*0.35;
  return g;
}
const armL=makeArm(-1), armR=makeArm(1);
playerGroup.add(armL); playerGroup.add(armR);

// Legs
function makeLeg(side){
  const g=new THREE.Group();
  const th=capsuleGrp(0.135,0.45,BLUE); th.children.forEach(c=>c.castShadow=true); g.add(th);
  const sh=capsuleGrp(0.11,0.38,BLUE); sh.position.y=-0.45; sh.children.forEach(c=>c.castShadow=true); g.add(sh);
  const ft=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.10,0.38),DBLUE); ft.position.set(0,-0.72,0.10); ft.castShadow=true; g.add(ft);
  g.position.set(side*0.24,0.16,0);
  return g;
}
const legL=makeLeg(-1), legR=makeLeg(1);
playerGroup.add(legL); playerGroup.add(legR);

// ════════ LEVEL BUILDER HELPERS ════════
function clearLevel(){
  for(const o of levelObjects) scene.remove(o);
  levelObjects=[]; platforms=[]; movingPlats=[]; spinners=[]; collectibles=[]; checkpoints=[];
}
function addObj(o){ scene.add(o); levelObjects.push(o); return o; }

function mkPlat(x,y,z,w,h,d,color){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color}));
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true;
  m.userData={w,h,d}; addObj(m); platforms.push(m); return m;
}
function mkMoving(x,y,z,w,h,d,color,axis,amp,spd){
  const m=mkPlat(x,y,z,w,h,d,color);
  m.userData.moving=true; m.userData.axis=axis; m.userData.amp=amp; m.userData.spd=spd;
  m.userData.origin=new THREE.Vector3(x,y,z);
  m.userData.lastPos=new THREE.Vector3(x,y,z);
  movingPlats.push(m); return m;
}
function mkSpinner(x,y,z,len,color,spd){
  const g=new THREE.Group(); g.position.set(x,y,z);
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.4,8),new THREE.MeshLambertMaterial({color:0x888888}));
  g.add(pole);
  const arms=new THREE.Group();
  arms.add(new THREE.Mesh(new THREE.BoxGeometry(len*2,0.22,0.22),new THREE.MeshLambertMaterial({color,emissive:color,emissiveIntensity:0.35})));
  arms.add(new THREE.Mesh(new THREE.BoxGeometry(0.22,0.22,len*2),new THREE.MeshLambertMaterial({color,emissive:color,emissiveIntensity:0.35})));
  g.add(arms); addObj(g); spinners.push({group:g,arms,spd}); return g;
}
function mkCP(x,y,z){
  const g=new THREE.Group(); g.position.set(x,y,z);
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,3,8),new THREE.MeshLambertMaterial({color:0xffffff}));
  pole.position.y=1.5; g.add(pole);
  const flag=new THREE.Mesh(new THREE.BoxGeometry(1.0,0.6,0.05),new THREE.MeshLambertMaterial({color:0x6c63ff,emissive:0x6c63ff,emissiveIntensity:0.5}));
  flag.position.set(0.55,3.1,0); g.add(flag);
  const star=new THREE.Mesh(new THREE.OctahedronGeometry(0.28,0),new THREE.MeshLambertMaterial({color:0xffd700,emissive:0xffa000,emissiveIntensity:0.6}));
  star.position.y=3.7; g.add(star);
  g.userData={activated:false,checkPos:new THREE.Vector3(x,y+2.5,z),star,flag};
  addObj(g); checkpoints.push(g); return g;
}
function mkGem(x,y,z){
  const m=new THREE.Mesh(new THREE.OctahedronGeometry(0.28,0),new THREE.MeshLambertMaterial({color:0xffd700,emissive:0xffaa00,emissiveIntensity:0.5}));
  m.position.set(x,y,z); m.userData={collected:false,baseY:y};
  addObj(m); collectibles.push(m); return m;
}
function mkFinish(x,y,z){
  const g=new THREE.Group(); g.position.set(x,y,z);
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,5,8),new THREE.MeshLambertMaterial({color:0xffd700,emissive:0xffd700,emissiveIntensity:0.4}));
  pole.position.y=2.5; g.add(pole);
  const banner=new THREE.Mesh(new THREE.BoxGeometry(3.5,1.2,0.08),new THREE.MeshLambertMaterial({color:0xff3c8e,emissive:0xff3c8e,emissiveIntensity:0.5}));
  banner.position.set(1.85,5.1,0); g.add(banner);
  const top=new THREE.Mesh(new THREE.OctahedronGeometry(0.45,0),new THREE.MeshLambertMaterial({color:0xffd700,emissive:0xffd700,emissiveIntensity:0.9}));
  top.position.y=6.3; g.add(top);
  addObj(g); return g;
}

// ════════ LEVEL DEFINITIONS ════════
// finish X ranges for detection
const FINISH_X=[[79,100],[98,120],[175,230],[215,295],[370,460]];

function buildLevel(lvl){
  clearLevel();
  const L=LEVELS[lvl];
  scene.background=new THREE.Color(L.fogC);
  scene.fog=new THREE.FogExp2(L.fogC,L.fogD);
  renderer.setClearColor(L.fogC);
  const {ps,ss,gf,ma}=L;

  if(lvl===0){ // ── Baby Steps ──────────────────────────────────────
    mkPlat(0,0,0,10,1,10,0x2244aa);
    mkPlat(8,0.5,0,6,1,5,0x3355cc);
    mkPlat(16,1,0,5,1,5,0x4466dd); mkGem(16,2.3,0);
    mkPlat(23,1,0,5,1,5,0x5577ee);
    mkCP(28,2,0);
    mkPlat(31,1,0,5,1,5,0x3355cc);
    for(let i=0;i<5;i++) mkPlat(38+i*5,1+i*0.8,0,4,1,4,0x2266cc);
    mkGem(58,6.2,0); mkCP(62,5.5,0);
    mkMoving(68,5,0,4,1,4,0xff3c8e,'x',ma,ps);
    mkPlat(76,5,0,5,1,5,0x3355cc);
    mkPlat(84,5,0,8,1,8,0x1a44bb);
    mkFinish(85,6,0);
  }
  else if(lvl===1){ // ── Getting Hot ──────────────────────────────────
    mkPlat(0,0,0,8,1,8,0x552200);
    mkPlat(7,0.5,0,4,1,4,0x663311);
    mkPlat(13,1,2,4,1,4,0x774422); mkGem(13,2.3,2);
    mkPlat(19,1.5,-2,3,1,4,0x885533);
    mkCP(24,2.5,-2);
    for(let i=0;i<6;i++){
      mkPlat(30+i*5.5*gf,2+i*1.0,(i%2===0?0:3),3.5,1,3.5,0x884422);
      if(i%2===0) mkGem(30+i*5.5*gf,3.5+i*1.0,(i%2===0?0:3));
    }
    mkCP(70,8,0);
    mkMoving(76,8,0,3.5,1,3.5,0xff5500,'x',ma,ps);
    mkMoving(85,8,0,3.5,1,3.5,0xff7700,'z',ma*0.7,ps*1.2);
    mkPlat(93,8,0,7,1,7,0x552200);
    mkSpinner(93,9.5,0,4,0xff5500,ss);
    mkPlat(102,8,0,8,1,8,0x773300);
    mkFinish(103,9,0);
  }
  else if(lvl===2){ // ── Danger Zone ──────────────────────────────────
    mkPlat(0,0,0,8,1,8,0x330033);
    const zx=[0,4,-4,5,-3,4,-4,3]; let cx=8,cy=1;
    for(let i=0;i<8;i++){
      cx+=5.5*gf; cy+=0.9;
      mkPlat(cx,cy,zx[i],3,1,3,0x6600aa);
      if(i%3===0) mkGem(cx,cy+1.3,zx[i]);
    }
    mkCP(cx+4,cy+1,0);
    let fx=cx+10;
    mkMoving(fx,cy+1,0,3,1,3,0xaa00ff,'x',ma,ps);
    mkMoving(fx+9,cy+1,0,3,1,3,0xcc00cc,'y',2,ps*0.8);
    mkMoving(fx+18,cy+1,0,3,1,3,0xff00aa,'z',ma,ps*1.3);
    mkPlat(fx+27,cy+1,0,7,1,7,0x440055);
    mkSpinner(fx+27,cy+2.5,0,4.5,0xcc00ff,ss);
    mkSpinner(fx+27,cy+2.5,0,3.0,0xff00cc,ss*1.4);
    mkCP(fx+36,cy+2,0);
    mkPlat(fx+40,cy+1,0,5,1,5,0x330033);
    for(let i=0;i<5;i++) mkPlat(fx+46+i*5*gf,cy+1+i*1.2,(i%2===0?0:4),2.5,1,2.5,0x550077);
    mkGem(fx+70,cy+7,4);
    mkPlat(fx+75,cy+7,0,8,1,8,0x220033);
    mkFinish(fx+76,cy+8,0);
  }
  else if(lvl===3){ // ── Nightmare ──────────────────────────────────────
    mkPlat(0,0,0,8,1,8,0x220000);
    const zp=[0,5,-5,8,-3,6,-6,4,0,7]; let nx=8,ny=1;
    for(let i=0;i<10;i++){
      nx+=5*gf; ny+=0.8+i*0.1;
      mkPlat(nx,ny,zp[i],2.2,1,2.2,0xaa1100);
      if(i%4===0) mkGem(nx,ny+1.3,zp[i]);
    }
    mkCP(nx+4,ny+1,0);
    let mx=nx+8;
    for(let i=0;i<4;i++) mkMoving(mx+i*9,ny+1,i%2===0?0:5,2.5,1,2.5,0xff2200,i%2===0?'x':'z',ma,ps+i*0.3);
    mkPlat(mx+36,ny+1,0,6,1,6,0x330000);
    mkSpinner(mx+36,ny+2.5,0,5,0xff0000,ss);
    mkSpinner(mx+36,ny+2.5,0,3.5,0xff4400,ss*1.5);
    mkCP(mx+45,ny+2,0);
    for(let i=0;i<5;i++) mkMoving(mx+50+i*8,ny+1,i%2===0?0:4,2.5,1,2.5,0xcc3300,'y',2.5,ps*0.9+i*0.2);
    mkGem(mx+74,ny+4,0); mkCP(mx+82,ny+1,0);
    const fx2=mx+86;
    mkPlat(fx2,ny+1,0,5,1,5,0x330000);
    mkSpinner(fx2,ny+2.5,0,4,0xff0000,ss*1.8);
    mkMoving(fx2+8,ny+1,0,2.5,1,2.5,0xff1100,'x',ma,ps*1.2);
    mkMoving(fx2+17,ny+1,0,2.5,1,2.5,0xff3300,'z',ma,ps*1.4);
    mkPlat(fx2+25,ny+1,0,8,1,8,0x220000);
    mkFinish(fx2+26,ny+2,0);
  }
  else if(lvl===4){ // ── Huggy's Wrath ──────────────────────────────────
    mkPlat(0,0,0,8,1,8,0x001a0a);
    const wz=[0,6,-6,8,-8,7,-5,9,-7,5,-6,8]; let wx=8,wy=1;
    for(let i=0;i<12;i++){
      wx+=4.8*gf; wy+=0.7+i*0.08;
      mkPlat(wx,wy,wz[i],2.0,1,2.0,0x00aa44);
      if(i%3===0) mkGem(wx,wy+1.3,wz[i]);
    }
    mkCP(wx+4,wy+1,0);
    let cx2=wx+8;
    const axes=['x','z','y','x','z'];
    for(let i=0;i<5;i++) mkMoving(cx2+i*9,wy+1,i%2===0?0:6,2.2,1,2.2,0x00ff88,axes[i],ma-i*0.3,ps+i*0.4);
    mkPlat(cx2+45,wy+1,0,5,1,5,0x002211);
    mkSpinner(cx2+45,wy+2.5,0,5,0x00ff44,ss);
    mkSpinner(cx2+45,wy+2.5,0,4,0x44ff88,ss*1.6);
    mkSpinner(cx2+45,wy+2.5,0,2.5,0x00ffaa,ss*2.2);
    mkCP(cx2+54,wy+2,0);
    let hx=cx2+58;
    for(let i=0;i<6;i++) mkMoving(hx+i*10,wy+1,(i%3-1)*5,2.0,1,2.0,0x00dd66,i%2===0?'x':'z',ma,ps+i*0.35);
    mkGem(hx+50,wy+4,0); mkCP(hx+62,wy+1,0);
    let gx=hx+68;
    for(let i=0;i<3;i++){
      mkPlat(gx+i*14,wy+1,0,5,1,5,0x001a08);
      mkSpinner(gx+i*14,wy+2.5,0,5,0x00ff66,ss*(1+i*0.5));
      mkSpinner(gx+i*14,wy+2.5,0,3,0x44ff00,ss*(1.5+i*0.5));
    }
    let finx=gx+45;
    for(let i=0;i<4;i++) mkMoving(finx+i*8,wy+1,i%2===0?0:5,1.8,1,1.8,0x00ffaa,'x',ma*0.8,ps*1.8);
    mkPlat(finx+35,wy+1,0,10,1,10,0x002211);
    mkFinish(finx+36,wy+2,0);
  }
  updateLevelHUD(); updateDots();
}

// ════════ COLLISION ════════
function checkPlatforms(){
  onGround=false; const pr=0.38;
  for(const p of platforms){
    const {w,h,d}=p.userData;
    const px=p.position.x,py=p.position.y,pz=p.position.z;
    if(pos.x<px-w/2-pr||pos.x>px+w/2+pr) continue;
    if(pos.z<pz-d/2-pr||pos.z>pz+d/2+pr) continue;
    const top=py+h/2;
    if(vel.y<=0&&pos.y<=top+0.35&&pos.y>=top-0.7){
      pos.y=top; vel.y=0; onGround=true; jumpCount=0;
      if(p.userData.moving&&p.userData.lastPos){
        const lp=p.userData.lastPos;
        pos.x+=p.position.x-lp.x;
        pos.z+=p.position.z-lp.z;
        if(p.position.y>lp.y) pos.y+=p.position.y-lp.y;
      }
    }
    if(vel.y>0&&pos.y+2.2>py-h/2&&pos.y+2.2<py-h/2+0.5) vel.y=-1;
  }
}
function checkSpinners(){
  const pb=new THREE.Box3(new THREE.Vector3(pos.x-0.42,pos.y,pos.z-0.42),new THREE.Vector3(pos.x+0.42,pos.y+2.3,pos.z+0.42));
  for(const s of spinners){
    for(const child of s.arms.children){
      if(new THREE.Box3().setFromObject(child).intersectsBox(pb)){playerDie();return;}
    }
  }
}
function checkCPs(){
  for(const cp of checkpoints){
    if(cp.userData.activated) continue;
    if(pos.distanceTo(cp.userData.checkPos)<3.5){
      cp.userData.activated=true;
      checkpointPos.copy(cp.userData.checkPos);
      cp.userData.flag.material.color.setHex(0x44ff88);
      cp.userData.flag.material.emissive.setHex(0x44ff88);
      showCPBanner(); score+=50; updateScoreHUD();
    }
  }
}
function checkGems(){
  for(const g of collectibles){
    if(g.userData.collected) continue;
    if(pos.distanceTo(g.position)<1.3){
      g.userData.collected=true; g.visible=false;
      score+=100; updateScoreHUD(); showMsg('💎 +100!');
    }
  }
}

// ════════ DEATH ════════
function playerDie(){
  if(isDead) return;
  isDead=true; lives--;
  updateLivesHUD(); flashScreen();
  if(lives<=0){setTimeout(showGameOver,700);return;}
  deathTimer=1.0; showMsg('💀 Jatuh!');
}
function respawn(){
  isDead=false;
  pos.copy(checkpointPos.lengthSq()>0?checkpointPos:new THREE.Vector3(0,4,0));
  vel.set(0,0,0); onGround=false; jumpCount=0;
  playerGroup.rotation.set(0,0,0);
}
function flashScreen(){
  const f=document.getElementById('flash');
  f.style.opacity=0.7; setTimeout(()=>f.style.opacity=0,120);
}

// ════════ INPUT ════════
const input={x:0,z:0};
let jsActive=false; const jsO={x:0,y:0}; const JRAD=46;
const zone=document.getElementById('joystick-zone');
const knob=document.getElementById('joystick-knob');

zone.addEventListener('touchstart',e=>{
  e.preventDefault();
  const r=zone.getBoundingClientRect();
  jsO.x=r.left+r.width/2; jsO.y=r.top+r.height/2; jsActive=true;
},{passive:false});
zone.addEventListener('touchmove',e=>{
  e.preventDefault(); if(!jsActive) return;
  let dx=e.touches[0].clientX-jsO.x, dy=e.touches[0].clientY-jsO.y;
  const d=Math.hypot(dx,dy); if(d>JRAD){dx=dx/d*JRAD;dy=dy/d*JRAD;}
  knob.style.transform=`translate(${dx}px,${dy}px)`;
  input.x=dx/JRAD; input.z=dy/JRAD;
},{passive:false});
zone.addEventListener('touchend',e=>{
  e.preventDefault(); jsActive=false; input.x=0; input.z=0;
  knob.style.transform='translate(0,0)';
},{passive:false});

document.getElementById('jump-btn').addEventListener('touchstart',e=>{e.preventDefault();doJump();},{passive:false});
document.getElementById('jump-btn').addEventListener('click',doJump);
document.getElementById('cam-btn').addEventListener('click',()=>cameraMode=(cameraMode+1)%3);

const keys={};
window.addEventListener('keydown',e=>keys[e.code]=true);
window.addEventListener('keyup',e=>keys[e.code]=false);
function getKeyInput(){
  if(!gameRunning) return;
  if(!jsActive){
    input.x=(keys['KeyD']||keys['ArrowRight']?1:0)-(keys['KeyA']||keys['ArrowLeft']?1:0);
    input.z=(keys['KeyS']||keys['ArrowDown']?1:0)-(keys['KeyW']||keys['ArrowUp']?1:0);
  }
  if((keys['Space']||keys['ArrowUp'])&&!keys['_jp']){keys['_jp']=true;doJump();}
  if(!keys['Space']&&!keys['ArrowUp']) keys['_jp']=false;
}
function doJump(){
  if(!gameRunning||isDead) return;
  if(onGround||jumpCount<2){vel.y=JUMP_FORCE+(jumpCount===1?1.5:0);onGround=false;jumpCount++;}
}

// ════════ HUD ════════
function updateLivesHUD(){const H=['❤️','❤️','❤️'];for(let i=lives;i<3;i++)H[i]='🖤';document.getElementById('hud-lives').textContent=H.join('');}
function updateScoreHUD(){document.getElementById('hud-score').textContent='⭐ '+score;}
function updateLevelHUD(){document.getElementById('hud-level').textContent=`LVL ${currentLevel+1}: ${LEVELS[currentLevel].name}`;}
function updateDots(){for(let i=0;i<5;i++){const d=document.getElementById('dot'+i);if(!d)continue;d.className='ldot';if(i<currentLevel)d.classList.add('done');else if(i===currentLevel)d.classList.add('active');}}
function showMsg(t){const e=document.getElementById('msg');e.textContent=t;e.style.opacity=1;clearTimeout(msgTimeout);msgTimeout=setTimeout(()=>e.style.opacity=0,1600);}
function showCPBanner(){const e=document.getElementById('cp-banner');e.style.opacity=1;clearTimeout(cpTimeout);cpTimeout=setTimeout(()=>e.style.opacity=0,2000);}
function updateProgress(){const[x1,x2]=FINISH_X[currentLevel];const t=Math.min((pos.x-0)/(x2-0),1);document.getElementById('progress-fill').style.width=(Math.max(0,t)*100).toFixed(1)+'%';}

// ════════ STARS ════════
const stars=[];
for(let i=0;i<100;i++){
  const s=new THREE.Mesh(new THREE.SphereGeometry(0.06,4,4),new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(Math.random(),1,0.85)}));
  s.position.set((Math.random()-.5)*160,Math.random()*40+5,(Math.random()-.5)*160);
  scene.add(s); stars.push(s);
}

// ════════ GAME LOOP ════════
function gameLoop(now){
  requestAnimationFrame(gameLoop);
  const dt=Math.min((now-lastTime)/1000,0.04);
  lastTime=now; time+=dt;

  if(!gameRunning){
    camera.position.set(8,6,14); camera.lookAt(0,2,0);
    renderer.render(scene,camera); return;
  }
  getKeyInput();

  if(isDead){
    deathTimer-=dt;
    playerGroup.rotation.z+=dt*4;
    if(deathTimer<=0) respawn();
    updateCamera(); renderer.render(scene,camera); return;
  }
  playerGroup.rotation.z=0;

  // Move
  const spd=MOVE_SPEED*(1+currentLevel*0.12);
  const md=new THREE.Vector3(input.x,0,input.z);
  if(md.lengthSq()>0){
    md.normalize(); vel.x=md.x*spd; vel.z=md.z*spd;
    playerGroup.rotation.y=Math.atan2(md.x,md.z);
  } else {vel.x*=0.75;vel.z*=0.75;}

  vel.y+=GRAVITY*dt;
  pos.addScaledVector(vel,dt);
  pos.x=Math.max(-6,pos.x);
  checkPlatforms();
  playerGroup.position.copy(pos);

  // Walk anim
  if(onGround&&md.lengthSq()>0){
    const w=Math.sin(time*9)*0.45;
    legL.rotation.x=w;legR.rotation.x=-w;armL.rotation.x=-w*0.6;armR.rotation.x=w*0.6;
  } else {legL.rotation.x*=0.85;legR.rotation.x*=0.85;armL.rotation.x*=0.85;armR.rotation.x*=0.85;}
  // Jump squish
  if(!onGround){const sq=vel.y>0?0.88:1.06;playerGroup.scale.set(1/sq,sq,1/sq);}
  else playerGroup.scale.set(1,1,1);

  if(pos.y<MAX_FALL) playerDie();

  // Moving platforms
  for(const mp of movingPlats){
    mp.userData.lastPos.copy(mp.position);
    const{axis,amp,spd:ms,origin}=mp.userData;
    const off=Math.sin(time*ms)*amp;
    mp.position.x=origin.x+(axis==='x'?off:0);
    mp.position.y=origin.y+(axis==='y'?off:0);
    mp.position.z=origin.z+(axis==='z'?off:0);
  }
  for(const s of spinners) s.arms.rotation.y+=dt*s.spd;
  for(const g of collectibles){
    if(!g.userData.collected){g.rotation.y+=dt*2.5;g.position.y=g.userData.baseY+Math.sin(time*2.2)*0.22;}
  }
  for(const cp of checkpoints) cp.userData.star.rotation.y+=dt*2;

  checkSpinners(); checkCPs(); checkGems(); updateProgress();

  if(!levelComplete){
    const[x1,x2]=FINISH_X[currentLevel];
    if(pos.x>x1&&pos.x<x2&&pos.y>2){
      levelComplete=true;
      score+=500+currentLevel*200; updateScoreHUD();
      setTimeout(()=>{ if(currentLevel>=LEVELS.length-1) showWin(); else showLevelClear(); },500);
    }
  }

  pl1.position.set(pos.x+Math.sin(time*0.8)*10,pos.y+7,pos.z+Math.cos(time*0.8)*10);
  pl2.position.set(pos.x+Math.cos(time*1.1)*10,pos.y+4,pos.z+Math.sin(time*1.1)*10);
  updateCamera();
  renderer.render(scene,camera);
}

function updateCamera(){
  const t=playerGroup.position;
  if(cameraMode===0) camera.position.set(t.x-10,t.y+8,t.z+13);
  else if(cameraMode===1) camera.position.set(t.x-18,t.y+6,t.z);
  else camera.position.set(t.x,t.y+22,t.z+6);
  camera.lookAt(t.x,t.y+1.2,t.z);
}

// ════════ GAME CONTROL ════════
function startGame(){
  document.getElementById('start-screen').style.display='none';
  initLevel(0);
}
function initLevel(lvl){
  currentLevel=lvl; levelComplete=false; isDead=false;
  checkpointPos.set(0,0,0);
  pos.set(0,4,0); vel.set(0,0,0); onGround=false; jumpCount=0;
  playerGroup.rotation.set(0,0,0); playerGroup.scale.set(1,1,1);
  buildLevel(lvl);
  updateLivesHUD(); updateScoreHUD(); updateProgress();
  gameRunning=true;
}
function nextLevel(){
  document.getElementById('level-clear-screen').style.display='none';
  lives=Math.min(lives+1,3);
  initLevel(currentLevel+1);
}
function showLevelClear(){
  gameRunning=false;
  document.getElementById('lc-msg').textContent=`Level ${currentLevel+1} selesai!\n⭐ Score: ${score}  |  +1 nyawa bonus!`;
  document.getElementById('level-clear-screen').style.display='flex';
  updateDots();
}
function showGameOver(){
  gameRunning=false;
  document.getElementById('gameover-screen').style.display='flex';
}
function showWin(){
  gameRunning=false;
  document.getElementById('win-score').textContent=`Score akhir: ⭐ ${score}\nHuggy Wuggy bangga! 🧸`;
  document.getElementById('win-screen').style.display='flex';
}
function restartFromCheckpoint(){
  document.getElementById('gameover-screen').style.display='none';
  lives=3; updateLivesHUD(); isDead=false; levelComplete=false;
  pos.copy(checkpointPos.lengthSq()>0?checkpointPos:new THREE.Vector3(0,4,0));
  vel.set(0,0,0); onGround=false; jumpCount=0;
  playerGroup.rotation.set(0,0,0); playerGroup.scale.set(1,1,1);
  gameRunning=true;
}
function restartGame(){
  ['gameover-screen','level-clear-screen','win-screen'].forEach(id=>document.getElementById(id).style.display='none');
  lives=3; score=0; updateDots();
  initLevel(0);
}

window.addEventListener('resize',()=>{
  renderer.setSize(window.innerWidth,window.innerHeight);
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});

requestAnimationFrame(gameLoop);
</script>
